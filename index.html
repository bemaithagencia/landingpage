  <style>/* ─────────────────────────────────────────────────────────────
   Casa de Isabel — Premium Dark Luxe Landing
   ───────────────────────────────────────────────────────────── */

:root {
  --bg: #F6F3EA;
  --bg-2: #EFE9D9;
  --card-from: #FBF7EC;
  --card-to: #F6F3EA;
  --gold-primary-1: #7A1F2B;
  --gold-primary-2: #A6303F;
  --gold-primary-3: #C25763;
  --gold-secondary: #8A2434;
  --copper-dark: #5C1420;
  --gold-line: rgba(110, 24, 37, 0.16);
  --gold-line-strong: rgba(110, 24, 37, 0.32);
  --gold: #7A1F2B;
  --bg-warm: #EFE9D9;
  --text: #33191E;
  --text-dim: #6E5A55;
  --max-w: 1280px;
  --pad-x: 32px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 24px;

  --font-sans: "DM Sans", "Geist", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --font-serif: "Instrument Serif", Georgia, serif;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html { overflow-x: hidden; max-width: 100%; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "ss02";
}

body {
  background: var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

/* ──────────────── Ambient backdrop: blurs + light points ──────────────── */
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 0;
}
body::before { display: none; }
body::after {
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 12% 18%, rgba(122, 31, 43, 0.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 12%, rgba(138, 36, 52, 0.5), transparent 60%),
    radial-gradient(1px 1px at 32% 44%, rgba(122, 31, 43, 0.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 36%, rgba(110, 24, 37, 0.55), transparent 60%),
    radial-gradient(1px 1px at 8% 58%, rgba(122, 31, 43, 0.45), transparent 60%),
    radial-gradient(2px 2px at 88% 64%, rgba(138, 36, 52, 0.5), transparent 60%),
    radial-gradient(1px 1px at 24% 78%, rgba(122, 31, 43, 0.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 52% 88%, rgba(110, 24, 37, 0.5), transparent 60%),
    radial-gradient(1px 1px at 72% 92%, rgba(122, 31, 43, 0.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 44% 24%, rgba(138, 36, 52, 0.4), transparent 60%);
  background-size: 100% 100%;
  animation: lights-drift 18s ease-in-out infinite alternate;
  opacity: var(--ambient-opacity, 0.65);
}
body.no-ambient::after { display: none; }
body.no-ambient::before { opacity: 0.35; }
@keyframes lights-drift {
  0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.55; }
  50% { opacity: 0.78; }
  100% { transform: translate3d(-18px, -22px, 0) scale(1.04); opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) { body::after { animation: none; } }

#root { position: relative; z-index: 1; }

img { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

::selection { background: rgba(110, 24, 37, 0.35); color: var(--text); }

/* ──────────────── Typography ──────────────── */
.h-display {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: clamp(40px, 5.2vw, 68px);
  line-height: 1.05;
  letter-spacing: -0.022em;
  margin: 0;
  text-wrap: balance;
}
.h-section {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: clamp(34px, 3.8vw, 52px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.h-card {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--gold-secondary);
}
.serif-italic {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
}
.gold { color: var(--gold-secondary); }
.gold-grad-text {
  background: linear-gradient(90deg, var(--gold-primary-1) 0%, var(--gold-primary-2) 50%, var(--gold-primary-3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.dim { color: var(--text-dim); }
.bold-white { color: var(--text); font-weight: 600; }

p { margin: 0 0 16px; color: var(--text-dim); }
p strong { color: var(--text); font-weight: 600; }

.kicker {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ──────────────── Layout ──────────────── */
.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}
section.section {
  padding: 72px 0;
  position: relative;
}
@media (max-width: 800px) {
  section.section { padding: 56px 0; }
}

/* ──────────────── Warm panel section variants ──────────────── */
/* O fundo quente vive num ::before que extrapola ±140px para fora da seção
   e tem máscara linear vertical, dissolvendo organicamente nas vizinhas. */
section.section.warm-panel {
  position: relative;
  isolation: isolate;
  background: transparent;
}
section.section.warm-panel::before { content: none; }
section.section.warm-panel > .container { position: relative; z-index: 1; }

/* Deep panel — mesmo tratamento, mais sutil */
section.section.deep-panel {
  position: relative;
  isolation: isolate;
  background: transparent;
}
section.section.deep-panel::before { content: none; }
section.section.deep-panel > .container { position: relative; z-index: 1; }

/* Edge fade between consecutive sections of different bgs */
/* ──────────────── Section transitions (organic seams) ──────────────── */
/* Warm/deep panels use a ::before pseudo that extends beyond the section's
   own bounds and is feather-masked top + bottom. The result is the warm
   bg dissolving into neighbors without any horizontal cut. */
section.section { position: relative; isolation: isolate; }

.divider {
  height: 1px;
  width: 100%;
  background: linear-gradient(90deg, transparent 0%, var(--gold-line-strong) 20%, var(--gold-line-strong) 80%, transparent 100%);
}

/* ──────────────── Tag-label "porta aberta" ──────────────── */
.tag-label {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  width: fit-content;
  white-space: nowrap;
  gap: 10px;
  padding: 8px 16px 8px 12px;
  border: 1px solid var(--gold-line-strong);
  border-radius: 8px;
  background: rgba(255,255,255,0.7);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7A1F2B;
  font-weight: 600;
}
.tag-label svg { flex-shrink: 0; }

/* ──────────────── CTA Button ──────────────── */
.btn-cta {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px 16px 32px;
  border-radius: 12px;
  background: linear-gradient(90deg, #5C1420 0%, #6E1825 100%);
  color: #FBF7EC;
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: box-shadow 0.35s cubic-bezier(.4,0,.2,1), transform 0.3s cubic-bezier(.4,0,.2,1), filter 0.3s ease;
  box-shadow: 0 0 0 1px rgba(122, 31, 43, 0.22) inset, 0 8px 30px -12px rgba(110, 24, 37, 0.4);
  position: relative;
  overflow: hidden;
}
.btn-cta::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform 0.7s ease;
  pointer-events: none;
}
.btn-cta:hover::before { transform: translateX(120%); }
.btn-cta:hover {
  box-shadow: 0 0 0 1px rgba(122, 31, 43, 0.45) inset, 0 16px 60px -8px rgba(138, 36, 52, 0.55), 0 0 0 6px rgba(110, 24, 37, 0.08);
  transform: translateY(-2px);
  filter: brightness(1.05);
}
.btn-cta > * { position: relative; z-index: 1; }
.btn-cta .arrow-box {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: rgba(246,235,221,0.18);
  color: #F6EBDD;
}
.btn-cta .arrow-box svg { width: 14px; height: 14px; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-radius: 12px;
  border: 1px solid var(--gold-line-strong);
  color: var(--text);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  background: rgba(255,255,255,0.55);
  transition: all 0.25s;
}
.btn-ghost:hover { border-color: var(--gold-secondary); background: rgba(255,255,255,0.8); }

/* ──────────────── Cards ──────────────── */
.card {
  border-radius: var(--r-lg);
  border: 1px solid var(--gold-line);
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(110, 24, 37, 0.06) 0%, transparent 60%),
    linear-gradient(180deg, var(--card-from) 0%, var(--card-to) 100%);
  padding: 36px;
  transition: border-color 0.4s ease, transform 0.4s cubic-bezier(.4,0,.2,1), box-shadow 0.4s ease;
  position: relative;
}
.card:hover {
  border-color: rgba(110, 24, 37, 0.55);
  transform: translateY(-4px);
  box-shadow: 0 24px 60px -30px rgba(110, 24, 37, 0.5), 0 0 0 1px rgba(110, 24, 37, 0.18);
}
.card-vertical {
  transition: transform 0.4s cubic-bezier(.4,0,.2,1), box-shadow 0.4s ease, border-color 0.4s ease;
}
.card-vertical:hover {
  transform: translateY(-6px) scale(1.01);
  box-shadow: 0 30px 60px -30px rgba(110, 24, 37, 0.6);
  border-color: rgba(110, 24, 37, 0.55);
}

/* ──────────────── Reveal-on-scroll ──────────────── */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.9s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1);
  will-change: opacity, transform;
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}
.card h3 { color: var(--gold-secondary); margin: 0 0 12px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.card p { margin: 0; font-size: 15px; }

/* Card vertical "tipo carta" */
.card-vertical {
  position: relative;
  aspect-ratio: 3/4;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--gold-line-strong);
  background: linear-gradient(180deg, #FFFFFF 0%, #FCF9F1 100%);
  flex-shrink: 0;
}
.card-vertical .photo-fill {
  position: absolute; inset: 0;
}
.card-vertical .top-tag {
  position: absolute; top: 14px; left: 14px;
  font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(250, 247, 242, 0.85);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(10, 7, 5, 0.45);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(122, 31, 43, 0.18);
}
.card-vertical .bottom-name {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 24px 18px;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 26px;
  color: #fff;
  line-height: 1;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.85) 100%);
  text-align: center;
  letter-spacing: -0.01em;
}
.card-vertical .num-overlay {
  position: absolute; bottom: 12px; right: 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: rgba(250, 247, 242, 0.6);
}

/* ──────────────── Editorial photo placeholder ──────────────── */
.ph {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(138, 36, 52, 0.06) 0%, transparent 55%),
    radial-gradient(140% 100% at 70% 90%, rgba(110, 24, 37, 0.08) 0%, transparent 60%),
    linear-gradient(180deg, #F2ECDB 0%, #EDE6D0 60%, #EAE2C9 100%);
  isolation: isolate;
}
.ph::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 50% at 80% 30%, rgba(122, 31, 43, 0.18) 0%, transparent 60%),
    radial-gradient(50% 70% at 20% 80%, rgba(110, 24, 37, 0.10) 0%, transparent 60%);
  mix-blend-mode: screen;
  pointer-events: none;
}
.ph .ph-label {
  position: absolute;
  bottom: 14px; left: 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: rgba(250, 247, 242, 0.55);
  text-transform: lowercase;
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(10, 7, 5, 0.55);
  border: 1px solid rgba(110, 24, 37, 0.18);
  backdrop-filter: blur(8px);
}

/* lamp-glow flavor: amber light spot */
.ph.lamp::before {
  content: "";
  position: absolute;
  width: 38%; aspect-ratio: 1;
  right: 8%; top: 30%;
  background: radial-gradient(circle, rgba(244, 220, 160, 0.28) 0%, rgba(232, 180, 100, 0.10) 35%, transparent 70%);
  filter: blur(14px);
  pointer-events: none;
  z-index: 1;
}

/* portrait silhouette suggestion (subtle ellipse) */
.ph.portrait::before {
  content: "";
  position: absolute;
  width: 55%;
  aspect-ratio: 0.7;
  left: 50%;
  bottom: -10%;
  transform: translateX(-50%);
  background:
    radial-gradient(60% 70% at 50% 25%, rgba(40, 25, 18, 0.85) 0%, rgba(40,25,18,0.6) 40%, transparent 75%),
    radial-gradient(40% 25% at 50% 18%, rgba(60, 40, 30, 0.95) 0%, transparent 70%);
  border-radius: 50% 50% 20% 20% / 60% 60% 25% 25%;
  filter: blur(2px);
  z-index: 0;
}

/* ──────────────── Avatar cluster ──────────────── */
.avatar-cluster {
  display: inline-flex;
}
.avatar-cluster .av {
  width: 38px; height: 38px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(255, 220, 180, 0.4), transparent 50%),
    linear-gradient(135deg, #5a3c28 0%, #2a1a10 100%);
  border: 2px solid var(--bg);
  margin-left: -10px;
  position: relative;
}
.avatar-cluster .av:first-child { margin-left: 0; }
.avatar-cluster .av:nth-child(1) { background: radial-gradient(circle at 35% 30%, #d4a888, #6a4838 70%); }
.avatar-cluster .av:nth-child(2) { background: radial-gradient(circle at 35% 30%, #c0997a, #4d3325 70%); }
.avatar-cluster .av:nth-child(3) {
  background: radial-gradient(circle at 35% 30%, #e8c098, #7a5642 70%);
  border-color: var(--gold-secondary);
}
.avatar-cluster .av:nth-child(4) { background: radial-gradient(circle at 35% 30%, #b8956f, #3a261a 70%); }

/* ──────────────── Mini benefit cards ──────────────── */
.benefit-row {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px;
  border-radius: 12px;
  border-left: 2px solid var(--gold-secondary);
  background: linear-gradient(90deg, rgba(110, 24, 37, 0.08) 0%, rgba(110, 24, 37, 0.06) 50%, transparent 100%);
  color: var(--text);
  font-size: 15px;
}
.benefit-row .b-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-secondary);
  letter-spacing: 0.1em;
}

/* ──────────────── Carrossel / arrows ──────────────── */
.carousel-arrow {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--gold-line-strong);
  background: rgba(255,255,255,0.8);
  color: var(--gold-secondary);
  display: grid; place-items: center;
  transition: all 0.25s;
}
.carousel-arrow:hover { border-color: var(--gold-secondary); background: rgba(40, 22, 12, 0.8); }
.carousel-arrow:disabled { opacity: 0.35; cursor: not-allowed; }

/* ──────────────── Mockups (laptop / phone / tablet) ──────────────── */
.laptop {
  position: relative;
  width: 100%;
  aspect-ratio: 16/10;
  perspective: 1200px;
}
.laptop .screen {
  position: absolute;
  inset: 4% 6% 12% 6%;
  border-radius: 14px 14px 4px 4px;
  background: #0a0604;
  border: 2px solid #2a1a10;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(110, 24, 37, 0.18), 0 30px 60px -20px rgba(60,30,20,0.25);
}
.laptop .base {
  position: absolute;
  left: 0; right: 0; bottom: 4%;
  height: 4%;
  background: linear-gradient(180deg, #FBF7EC 0%, #0c0806 100%);
  border-radius: 0 0 18px 18px;
}
.laptop .notch {
  position: absolute;
  left: 50%; bottom: 4%;
  transform: translateX(-50%);
  width: 12%; height: 1.5%;
  background: #FBF7EC;
  border-radius: 0 0 8px 8px;
  z-index: 2;
}

.phone {
  position: relative;
  width: 100%;
  aspect-ratio: 9/19;
  border-radius: 32px;
  background: #0a0604;
  border: 2px solid #2a1a10;
  padding: 8px;
  box-shadow: 0 30px 60px -20px rgba(60,30,20,0.3), 0 0 0 1px rgba(110, 24, 37, 0.14) inset;
  overflow: hidden;
}
.phone .screen {
  width: 100%; height: 100%;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
}
.phone .island {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 28%; height: 16px;
  background: #000;
  border-radius: 12px;
  z-index: 5;
}

.tablet {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: 18px;
  background: #0a0604;
  border: 2px solid #2a1a10;
  padding: 10px;
  box-shadow: 0 30px 60px -20px rgba(60,30,20,0.25);
  overflow: hidden;
}
.tablet .screen {
  width: 100%; height: 100%;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

/* ──────────────── Pricing ──────────────── */
.price-card {
  border-radius: 22px;
  padding: 36px;
  position: relative;
  overflow: hidden;
}
.price-card.dark {
  background: linear-gradient(180deg, var(--card-from) 0%, var(--card-to) 100%);
  border: 1px solid var(--gold-line-strong);
}
.price-card.gold {

/* ──────────────── Hero photo frame — diffused into background ──────────────── */
.hero-photo-frame {
  position: relative;
  width: 100%;
  min-height: 720px;
  overflow: visible;
  isolation: isolate;
  background: transparent;
}
.hero-photo-img {
  position: absolute;
  inset: -60px -80px -60px -80px;
  background-size: cover;
  background-position: center 30%;
  filter: contrast(1.05) saturate(0.85) brightness(0.92) sepia(0.06);
  z-index: 0;
  /* feather all 4 edges so photo dissolves into the page bg, especially on the left where it meets text column */
  -webkit-mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.2) 8%, rgba(60,30,20,0.25) 18%, #000 32%, #000 78%, rgba(0,0,0,0.6) 92%, transparent 100%),
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 8%, #000 20%, #000 80%, rgba(0,0,0,0.5) 92%, transparent 100%);
  mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.2) 8%, rgba(60,30,20,0.25) 18%, #000 32%, #000 78%, rgba(0,0,0,0.6) 92%, transparent 100%),
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 8%, #000 20%, #000 80%, rgba(0,0,0,0.5) 92%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
}
.hero-photo-frame:hover .hero-photo-img { transform: scale(1.10); }

/* placeholder card — same feathered footprint as hero-photo-img, but a soft frame
   so the user knows where their own photo will sit */
.hero-photo-placeholder {
  position: absolute;
  inset: 40px 60px 40px 60px;
  border-radius: 8px;
  border: 1px dashed rgba(194,87,99,0.32);
  background:
    radial-gradient(ellipse 80% 70% at 50% 45%, rgba(194,87,99,0.06), transparent 70%),
    linear-gradient(180deg, rgba(40,24,12,0.55), rgba(20,10,6,0.55));
  display: grid;
  place-items: center;
  z-index: 0;
  -webkit-mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.5) 6%, #000 14%, #000 86%, rgba(0,0,0,0.5) 94%, transparent 100%),
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 6%, #000 14%, #000 86%, rgba(0,0,0,0.5) 94%, transparent 100%);
  mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.5) 6%, #000 14%, #000 86%, rgba(0,0,0,0.5) 94%, transparent 100%),
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 6%, #000 14%, #000 86%, rgba(0,0,0,0.5) 94%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
}
.hero-photo-placeholder-inner {
  text-align: center;
  color: rgba(194,87,99,0.7);
  display: flex; flex-direction: column; align-items: center;
}

/* subtle hex/diamond geometric pattern overlay (like reference) */
.hero-photo-pattern {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background-image: none;
  mask-image: radial-gradient(ellipse 90% 80% at 70% 40%, transparent 30%, #000 70%);
  -webkit-mask-image: radial-gradient(ellipse 90% 80% at 70% 40%, transparent 30%, #000 70%);
  mix-blend-mode: screen;
  opacity: 0.6;
}

/* inset card — small portrait floating top-right */
.hero-photo-inset {
  position: absolute;
  top: 32px; right: 32px;
  width: 150px; height: 200px;
  border-radius: 6px;
  overflow: hidden;
  z-index: 4;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(110,24,37,0.25);
}
.hero-photo-inset-img {

  background-size: cover;
  background-position: center;
  filter: contrast(1.05) saturate(0.9) brightness(0.92) sepia(0.12);
}
.hero-photo-inset-tag {
  position: absolute;
  bottom: -14px; right: -8px;
  background: linear-gradient(95deg, #7A1F2B 0%, #8A2434 100%);
  color: #FBF7EC;
  padding: 8px 14px 8px 12px;
  border-radius: 6px;
  font-size: 11px;
  line-height: 1.25;
  display: flex; align-items: center; gap: 8px;

}
.hero-photo-inset-tag-dot {

  flex-shrink: 0;
}
@media (max-width: 800px) {

}

/* radial vignette: sharp center, blurred and darkened edges */
.hero-photo-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(ellipse 70% 80% at 50% 45%, transparent 30%, rgba(10,7,5,0.35) 70%, rgba(10,7,5,0.85) 100%),

    linear-gradient(90deg, rgba(10,7,5,0.35) 0%, transparent 18%, transparent 82%, rgba(10,7,5,0.4) 100%);
}
/* golden ambient glow — soft warm wash, no hard edges */
.hero-photo-glow {
  position: absolute;
  inset: -40px -60px -40px -60px;
  pointer-events: none;
  z-index: 2;
  background:
    radial-gradient(ellipse 65% 50% at 50% 35%, rgba(122,31,43,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 55% 35% at 75% 80%, rgba(110,24,37,0.16) 0%, transparent 65%),
    radial-gradient(ellipse 45% 30% at 20% 20%, rgba(138,36,52,0.08) 0%, transparent 65%);
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 35%, transparent 90%);
  mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 35%, transparent 90%);
}
/* removed inset shadow — no hard ring anymore */

/* responsive helpers */
.split-2 {

/* horizontal scroll carrossel */
.h-scroll {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  padding-bottom: 6px;
  scroll-behavior: smooth;
}
.h-scroll::-webkit-scrollbar { display: none; }
.h-scroll > * { scroll-snap-align: start; }

/* hero subtle scrollbar over right edge */
.hero-edge-rail {
  position: absolute;
  left: 12px; top: 32px; bottom: 32px;
  width: 32px;
  border-right: 1px solid var(--gold-line);
  border-radius: 32px 0 0 32px;
  pointer-events: none;
}
@media (max-width: 1100px) { .hero-edge-rail { display: none; } }

.hero-bg-frame {
  border-radius: 0;
  border: none;
  position: relative;
  overflow: visible;
  align-items: stretch;
}
.hero-bg-frame > * { min-height: 0; }

.hero-founders-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 640px;
  overflow: hidden;
}

/* Hero: foto preenche toda a coluna direita, esticando do topo ao fim */
.hero-founders-img {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center right;
  display: block;
  /* Esfumar a foto nas 4 bordas pra fundir no fundo escuro */
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 22%, #000 70%, transparent 96%),
    linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to right, transparent 0%, #000 22%, #000 70%, transparent 96%),
    linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
  mask-composite: intersect;
  filter: brightness(0.92) contrast(1.04) saturate(0.95);
}
.hero-founders-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(ellipse 90% 70% at 60% 50%, transparent 0%, transparent 50%, rgba(13,8,5,0.55) 90%, rgba(13,8,5,0.85) 100%);
}
.founders-photo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 560px;
}

/* Hero: foto com fade lateral natural, alinhada à direita, sem blend */

/* Seção "Quem Conduz" (versão circular): mistura no fundo escuro */
.founders-photo {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 560px;
  height: auto;
  display: block;
  mix-blend-mode: screen;
  filter: contrast(1.05) saturate(0.95);
}

/* glow dourado por trás da foto circular (apenas seção "Quem conduz") */
.founders-photo-wrap::before {
  content: "";
  position: absolute;
  z-index: 1;
  width: 78%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    rgba(199, 156, 92, 0.28) 0%,
    rgba(199, 156, 92, 0.12) 30%,
    rgba(199, 156, 92, 0) 65%);
  filter: blur(8px);
  pointer-events: none;
}

/* variante "framed": foto retangular com moldura dourada própria, sem blend */
.founders-photo-wrap--framed::before { display: none; }
.founders-photo--framed {
  mix-blend-mode: normal;
  filter: none;
  max-width: 480px;
  border-radius: 4px;
  box-shadow:
    0 30px 80px -30px rgba(0, 0, 0, 0.7),

/* ═══════════════ MOBILE POLISH ═══════════════ */
@media (max-width: 768px) {
  :root { --pad-x: 20px; }
  section.section { padding: 48px 0; overflow-x: hidden; max-width: 100%; }
  section { max-width: 100%; }
  body { max-width: 100vw; overflow-x: hidden; }

  /* Hero: empilha em coluna única, foto vai pra cima */
  .hero-bg-frame {
    grid-template-columns: 1fr !important;
    min-height: auto !important;
  }
  .hero-founders-wrap {
    display: none !important;
  }
  .hero-bg-frame > div:first-child {
    padding: 32px 20px 24px !important;
    gap: 20px !important;
  }
  .h-display { font-size: clamp(32px, 8vw, 44px) !important; line-height: 1.08 !important; }
  .h-section { font-size: clamp(26px, 6.5vw, 36px) !important; line-height: 1.12 !important; }

  /* CTAs full width */
  .btn-cta { width: 100%; justify-content: center; padding: 16px 22px; font-size: 14px; }

  /* Avatar cluster spacing */
  .avatar-cluster { gap: 8px; }

  /* Form */
  .bm-form-grid { grid-template-columns: 1fr !important; gap: 14px !important; }

  /* FAQ — bigger hit targets */
  .faq-item button, .faq-q { min-height: 56px; padding: 18px 20px !important; font-size: 15px !important; }
  .plus { width: 32px !important; height: 32px !important; font-size: 18px !important; }

  /* Section transitions: shorter bleed on mobile */
  section.section.warm-panel::before,
  section.section.deep-panel::before {
    top: -90px !important;
    bottom: -90px !important;
  }

  /* Marquee — slow down e cards menores */
  .marquee-track { animation-duration: 40s !important; }
  .marquee-card { width: 220px !important; height: 280px !important; }

  /* Numeros grid */
  .numeros-grid { grid-template-columns: 1fr 1fr !important; gap: 16px !important; }
  .numeros-grid > div:nth-child(5) { grid-column: span 2; }

  /* Pilares + Para Quem grids — single column */
  .pilares-grid, .para-quem-cols { grid-template-columns: 1fr !important; gap: 20px !important; }

  /* Depoimentos cards stack */
  .deps-grid { grid-template-columns: 1fr !important; }

  /* Portfolio grid — single column */
  .pf-grid {
    grid-template-columns: 1fr !important;
    grid-template-rows: auto !important;
  }
  .pf-card { aspect-ratio: 16/10 !important; min-height: 220px; }
  .pf-card--ebook { aspect-ratio: 3/4 !important; }

  /* Process journey — vira lista vertical */
  .journey-stage { padding: 0 !important; }
  .journey-ring { display: none !important; }
  .journey-list-mobile { display: flex !important; }

  /* Servicos titles */
  .marquee-title { font-size: 16px !important; }

  /* Footer */
  footer { padding: 40px 20px !important; }
  footer .container { flex-direction: column !important; gap: 24px !important; align-items: flex-start !important; }
}

@media (max-width: 480px) {
  :root { --pad-x: 16px; }
  section.section { padding: 40px 0; }
  .h-display { font-size: clamp(28px, 9vw, 38px) !important; }
  .container { padding: 0 16px !important; }
  .marquee-card { width: 180px !important; height: 240px !important; }
  .pf-overlay { padding: 14px !important; }
  .pf-peca { font-size: 16px !important; }
  /* Tag labels — wrap se precisar */
  .tag-label { font-size: 10px !important; padding: 6px 12px !important; }
  /* Force grids para 1 coluna */
  .pilares-grid, .numeros-grid, .paraquem-grid, .deps-grid, .footer-grid, .form-grid {
    grid-template-columns: 1fr !important;

}

/* Touch hit targets — sempre */
@media (max-width: 768px) and (pointer: coarse) {

}
